      name="title"
      content="Samuel Landry Woulle Ndedy — Développeur Mobile & Fullstack (Flutter • React) & UI/UX Designer"

    <meta

      content="Samuel Landry Woulle Ndedy, Développeur Flutter Douala, Développeur React Cameroun, Développeur Mobile Fullstack, UI/UX Designer Figma, Portfolio Développeur"
    />
    <meta name="author" content="Samuel Landry Woulle Ndedy" />
    <meta name="theme-color" content="#0A0A0A" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta
      property="og:title"
      content="Samuel Landry Woulle Ndedy — Développeur Mobile & Fullstack (Flutter • React)"
    />
    <meta
      property="og:description"
      content="Titulaire d'un cursus Master en Génie Logiciel, je conçois et développe des applications mobiles et web performantes, de la maquette Figma jusqu'au déploiement backend."
    />

    <!-- Twitter Card -->

      name="twitter:title"

    />

    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Prevent theme flash (Dark Mode by default) -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-canvas-light text-slate-900 dark:bg-canvas-dark dark:text-slate-100 antialiased selection:bg-blue-500/25 selection:text-blue-600 dark:selection:text-blue-300">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
